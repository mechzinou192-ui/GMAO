# Déploiement GRATUIT d'une démonstration sur Render (https://render.com) — voir HEBERGEMENT-GRATUIT.md
# Base de données : DATABASE_URL (Neon, gratuit) recommandé pour conserver les données.
# Laissé vide, la base intégrée est utilisée (données remises à zéro à chaque redéploiement).
services:
  - type: web
    name: gmao-setram-demo
    runtime: docker
    plan: free
    rootDir: gmao-setram-server/server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # adresse de la base Neon (à coller, voir le guide) — facultatif
        sync: false
      - key: JWT_SECRET            # clé de session générée automatiquement par Render
        generateValue: true
      - key: DEMO                  # mode démonstration : comptes publics + données fictives
        value: "1"
      - key: DEMO_RESET_HOURS      # remise à zéro des données de démo toutes les 24 h
        value: "24"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
