# Intégration continue : à chaque envoi de code et à chaque demande de fusion.
# La CI échoue si une seule étape échoue : tests, analyse du code, compilation, audit des dépendances,
# détection de secrets, construction Docker et démarrage complet de la pile.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Serveur — tests et audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: gmao-setram-server/server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: gmao-setram-server/server/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Tests (base PostgreSQL intégrée)
        run: npm test
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=moderate

  serveur-postgres:
    name: Serveur — tests sur PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: gmao-setram-server/server } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: gmao_test, POSTGRES_USER: gmao, POSTGRES_PASSWORD: ci-uniquement-pas-un-secret }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gmao -d gmao_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://gmao:ci-uniquement-pas-un-secret@localhost:5432/gmao_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: gmao-setram-server/server/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test

  interface:
    name: Interface — analyse, tests, compilation, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: gmao-setram-server/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: gmao-setram-server/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Analyse du code (références non définies, code mort)
        run: npm run lint -- --max-warnings=0
      - name: Tests
        run: npm test
      - name: Compilation (application servie par le serveur)
        run: npm run build
      - name: Compilation du site de démonstration
        run: npm run build:demo
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=moderate

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (historique complet)
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.18.4 detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --exit-code=1

  integration:
    name: Docker — construction et démarrage complet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [serveur, interface]
    defaults: { run: { working-directory: gmao-setram-server } }
    steps:
      - uses: actions/checkout@v4
      - name: Fichier .env de test (secrets aléatoires, jamais réutilisés)
        run: |
          cp .env.example .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n/+=')|" .env
          sed -i "s|^GMAO_HOST=.*|GMAO_HOST=localhost|" .env
          sed -i "s|^ADMIN_INITIAL_PASSWORD=.*|ADMIN_INITIAL_PASSWORD=Ci$(openssl rand -hex 8)9|" .env
      - name: Configuration Docker Compose valide
        run: docker compose config --quiet
      - name: Construction et démarrage (attend que les contrôles de santé soient verts)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Parcours de bout en bout via HTTPS (Caddy → application → PostgreSQL)
        run: |
          set -e
          curl -fsk --resolve localhost:443:127.0.0.1 https://localhost/api/ready | grep -q '"ok":true'
          curl -fsk https://localhost/ | grep -qi '<div id="root">'
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H 'X-Requested-With: gmao' https://localhost/api/auth/me); test "$code" = "401"
          curl -sk -D - -o /dev/null -H 'X-Requested-With: gmao' https://localhost/api/config | grep -qi '^ratelimit-limit'
          # connexion avec le mot de passe initial : changement exigé
          pw=$(grep '^ADMIN_INITIAL_PASSWORD=' .env | cut -d= -f2)
          curl -fsk -H 'Content-Type: application/json' -H 'X-Requested-With: gmao' -d "{\"id\":\"admin\",\"password\":\"$pw\"}" https://localhost/api/auth/login | grep -q 'mustChangePw'
      - name: Contrôle d'installation (scripts/verifier-installation.sh) — informatif avec le certificat interne de test
        continue-on-error: true
        run: INSECURE=1 ./scripts/verifier-installation.sh https://localhost
      - name: Arrêt propre (SIGTERM) sans erreur
        run: |
          docker compose stop app
          docker compose logs app | grep -q '"msg":"serveur arrêté"'
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Nettoyage
        if: always()
        run: docker compose down -v
